[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Shared ESP32 settings. Arduino framework, simulated sensors by default.
; ---------------------------------------------------------------------------
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<host/>
lib_deps =
    knolleary/PubSubClient@^2.8

; Physical ESP32, simulated sensors, JSON over Serial.
; Add -D ENABLE_MQTT and create include/secrets.h to publish over Wi-Fi/MQTT.
[env:esp32dev]
extends = esp32_base
build_flags =
    -D USE_SIMULATED_SENSORS=1
    -D USE_REAL_SENSORS=0

; Wokwi simulator (VS Code extension): ESP32 + simulated sensors + MQTT to a public broker.
; Time is accelerated 120x so one simulated day passes in 12 minutes.
[env:wokwi]
extends = esp32_base
build_flags =
    -D USE_SIMULATED_SENSORS=1
    -D USE_REAL_SENSORS=0
    -D ENABLE_MQTT
    -D WOKWI
    -D DEVICE_ID=\"mh-grupp6\"
    -D SIM_TIME_SCALE=120

; Physical ESP32 with SHT40 + 2x DS18B20 through the same HAL. Compiles; not hardware-tested.
[env:esp32dev_real]
extends = esp32_base
build_flags =
    -D USE_SIMULATED_SENSORS=0
    -D USE_REAL_SENSORS=1
lib_deps =
    ${esp32_base.lib_deps}
    adafruit/Adafruit SHT4x Library@^1.0.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Unit tests of the hardware-independent core on the PC: pio test -e native
[env:native]
platform = native
build_flags =
    -std=c++17
    -Iinclude
build_src_filter = +<validator.cpp> +<alarm.cpp> +<sensor_manager.cpp> +<payload.cpp> +<hal/simulated_sensors.cpp>
test_framework = unity
test_build_src = yes

; Host program running the same core and printing JSON lines: pio run -e native_sim
[env:native_sim]
platform = native
build_flags =
    -std=c++17
    -Iinclude
build_src_filter = +<validator.cpp> +<alarm.cpp> +<sensor_manager.cpp> +<payload.cpp> +<hal/simulated_sensors.cpp> +<host/host_main.cpp>
